<template>
    <div>
        <g-page-heading

        ></g-page-heading>
        <g-summary :rows="main_data" unit="入口" :loading="listLoading" @refresh="tableData"></g-summary>

        <section class="g-panel" aria-label="智能路由 · 入口列表">
            <g-list-toolbar v-model="searchText" :filter.sync="statusFilter" :counts="listCounts"

            >
            <g-list-feedback

            <template v-if="!listError && filteredRows.length">

                    <colgroup>

                    </colgroup>
                    <thead>
                        <tr>
                            <th>名称</th>

                            <th>成员 / 线路状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="row in filteredRows" :key="row.name">
                            <td>
                                <div class="g-name-cell">
                                    <span class="g-record-icon"><g-icon name="input"></g-icon></span>
                                    <div class="g-name-stack">
                                        <button class="g-name" :title="row.name" @click="invokeEdit(row)">
                                            {{ row.name }}
                                        </button>
                                    </div>
                                </div>
                                <span class="g-subtext">{{ policyLabel(row) }}</span>
                                <div v-for="warning in row.probe_warnings" :key="warning" class="g-form-note g-danger">{{ warning }}</div>
                            </td>
                            <td>
                                <span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span

                            </td>
                            <td>
                                <span class="g-endpoint">{{ row.listen }}</span>
                            </td>
                            <td>
                                <div v-for="(name, index) in row.members" :key="name" class="g-member">
                                    <span class="g-priority">{{ index + 1 }}</span
                                    ><span class="g-member-name">{{ name }}</span
                                    ><span class="g-preferred" v-if="row.preferred_member === name">当前</span
                                    ><span>{{
                                        memberStatus(row, name)

                                    ><span
                                        class="g-danger"
                                        v-if="(row.member_no_health || []).indexOf(name) >= 0"
                                        >无健康数据</span
                                    >
                                </div>
                                <div v-if="row.member_quality" class="g-route-quality">
                                    <div v-for="name in row.members" :key="name" :title="((row.member_quality || {})[name] || {}).last_error">
                                        {{ name }}：{{ qualityText(row, name) }}
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="g-row-actions">
                                    <button
                                        class="g-switch"
                                        role="switch"
                                        :aria-checked="!row.disabled ? 'true' : 'false'"
                                        :aria-label="row.name + ' 启用状态'"

                                    ></button
                                    ><button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                    ><i-dropdown

                                        ><button
                                            class="g-more"

                                        >
                                            <g-icon name="more"></g-icon></button
                                        ><i-dropdown-menu slot="list"
                                            ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                            ><i-dropdown-item name="log">切换记录</i-dropdown-item
                                            ><i-dropdown-item name="delete" divided
                                                ><span class="g-danger">删除入口</span></i-dropdown-item
                                            ></i-dropdown-menu
                                        ></i-dropdown
                                    >
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="g-cards">
                    <article class="g-card" v-for="row in filteredRows" :key="row.name">
                        <div class="g-card-heading">
                            <span class="g-record-icon"><g-icon name="input"></g-icon></span>
                            <div class="g-name-stack">
                                <button class="g-name" @click="invokeEdit(row)">{{ row.name }}</button
                                ><span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span
                                >
                            </div>
                            <button
                                class="g-switch"
                                role="switch"
                                :aria-checked="!row.disabled ? 'true' : 'false'"
                                :aria-label="row.name + ' 启用状态'"
                                :disabled="!!mutationPending[row.name]"
                                @click="invokeSetDisabled(row, row.disabled)"
                            ></button>
                        </div>
                        <div class="g-card-listen">
                            <span>监听</span><span class="g-endpoint">{{ row.listen }}</span>
                        </div>
                        <div class="g-card-members">
                            <div v-for="(name, index) in row.members" :key="name" class="g-member">
                                <span class="g-priority">{{ index + 1 }}</span
                                ><span class="g-member-name">{{ name }}</span
                                ><span class="g-preferred" v-if="row.preferred_member === name">当前</span
                                ><span>{{
                                    memberStatus(row, name)

                                ><span class="g-danger" v-if="(row.member_no_health || []).indexOf(name) >= 0"
                                    >无健康数据</span

                        </div>
                        <div v-for="warning in row.probe_warnings" :key="warning" class="g-form-note g-danger">{{ warning }}</div>
                        <div v-if="row.member_quality" class="g-route-quality">
                            <div v-for="name in row.members" :key="name" :title="((row.member_quality || {})[name] || {}).last_error">
                                {{ name }}：{{ qualityText(row, name) }}
                            </div>
                        </div>
                        <div class="g-card-bottom">
                            <span class="g-subtext">{{ policyLabel(row) }}</span>
                            <div class="g-card-buttons">
                                <button class="g-btn-link" @click="invokeSwitchLog(row)">记录</button
                                ><button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                ><i-dropdown
                                    trigger="click"
                                    placement="bottom-end"
                                    transfer
                                    @on-click="invokeRowAction($event, row)"
                                    ><button
                                        class="g-more"
                                        :aria-label="row.name + ' 更多操作'"
                                        aria-haspopup="menu"
                                    >
                                        <g-icon name="more"></g-icon></button
                                    ><i-dropdown-menu slot="list"
                                        ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                        ><i-dropdown-item name="log">切换记录</i-dropdown-item
                                        ><i-dropdown-item name="delete" divided
                                            ><span class="g-danger">删除入口</span></i-dropdown-item
                                        ></i-dropdown-menu
                                    ></i-dropdown
                                >
                            </div>
                        </div>
                    </article>
                </div></template
            ><g-list-footer
                :total="pageTotal"
                :size="pageSize"
                :page="$route.query.page"
                :visible="filteredRows.length"
                @change="invokeChangePage"
            ></g-list-footer>
        </section>
        <p class="g-page-note"><g-icon name="info"></g-icon>搜索与状态统计针对当前已加载列表。</p>
        <i-modal
            v-model="editModal"
            :title="editModalData.uuid ? '编辑入口' : '新建入口'"
            :width="560"
            class-name="g-dialog"
        >
            <i-form :label-width="110">
                <i-form-item label="名称">
                    <i-input v-model="editModalData.name" placeholder="如 socks-in"></i-input>
                </i-form-item>
                <i-form-item label="监听地址">
                    <i-input
                        v-model="editModalData.listen"
                        placeholder="host:port，如 0.0.0.0:1001"
                    ></i-input>
                    <div class="g-form-note">
                        入口模式监听裸 host:port，不带协议；透明转发到所选 member 的 input。
                    </div>
                </i-form-item>
                <i-form-item label="成员隧道（按优先级）">
                    <i-select
                        v-model="editModalData.members"
                        multiple
                        filterable
                        placeholder="选择 tunnel，顺序即优先级；input 协议需一致"
                    >
                        <i-option v-for="t in memberOptions" :value="t" :key="t">{{ t }}</i-option>
                    </i-select>
                    <ol class="g-member-order">
                        <li v-for="(name, index) in editModalData.members" :key="name">
                            <span>{{ index + 1 }}. {{ name }}</span
                            ><button
                                type="button"
                                :disabled="index === 0"
                                @click="moveMember(index, -1)"
                                :aria-label="name + ' 上移'"
                            >
                                ↑</button
                            ><button
                                type="button"
                                :disabled="index === editModalData.members.length - 1"
                                @click="moveMember(index, 1)"
                                :aria-label="name + ' 下移'"
                            >
                                ↓
                            </button>
                        </li>
                    </ol>
                    <div class="g-form-note g-danger">
                        所有 member 的 input 协议必须一致（如全为 socks5x）。
                    </div>
                </i-form-item>
                <i-form-item label="切换策略">
                    <i-select v-model="editModalData.policy" aria-label="切换策略">
                        <i-option value="quality">质量优先（完整链路）</i-option>
                        <i-option value="priority">优先级故障转移（完整链路）</i-option>
                    </i-select>
                    <div class="g-form-note">两种策略均使用完整链路探测，仅支持明文、无 input 帧头的 socks5x 成员；只影响新连接。</div>
                    <div v-if="editModalData.probe_warnings && editModalData.probe_warnings.length" class="g-form-note g-danger">
                        此入口仍使用旧版单跳探测。保存将升级为完整链路探测，请先调整以下成员：
                        <div v-for="warning in editModalData.probe_warnings" :key="warning">{{ warning }}</div>
                    </div>
                </i-form-item>
                <template>
                    <i-form-item label="下载探测目标">
                        <i-input v-model="editModalData.quality.download_url" placeholder="HTTPS 下载 URL" aria-label="下载探测目标"></i-input>
                    </i-form-item>
                    <i-form-item label="连通性目标">
                        <i-input v-model="editModalData.quality.connectivity_url" placeholder="HTTPS 连通性 URL" aria-label="连通性目标"></i-input>
                        <div class="g-form-note">下载失败后辅助确认；不会抵消下载失败样本。</div>
                    </i-form-item>
                    <i-form-item label="下载预期状态">
                        <i-input-number v-model="editModalData.quality.download_status" :min="200" :max="299" aria-label="下载预期状态"></i-input-number>
                    </i-form-item>
                    <i-form-item label="连通预期状态">
                        <i-input-number v-model="editModalData.quality.connectivity_status" :min="200" :max="299" aria-label="连通预期状态"></i-input-number>
                    </i-form-item>
                    <i-form-item label="预期下载字节">
                        <i-input-number v-model="editModalData.quality.download_bytes" :min="1" :max="1048576" aria-label="预期下载字节"></i-input-number>
                        <div class="g-form-note">默认 16384（16 KiB）；修改后需同时调整目标 URL 或自建文件，响应长度必须一致。</div>
                    </i-form-item>
                    <i-form-item label="探测间隔(秒)">
                        <i-input-number v-model="editModalData.quality.interval_sec" :min="10" :max="3600" aria-label="探测间隔秒"></i-input-number>
                    </i-form-item>
                    <i-form-item label="总超时(毫秒)">
                        <i-input-number v-model="editModalData.quality.timeout_ms" :min="100" :max="30000" aria-label="总超时毫秒"></i-input-number>
                    </i-form-item>
                    <i-form-item label="正常时间(毫秒)">
                        <i-input-number v-model="editModalData.quality.normal_ms" :min="1" :max="editModalData.quality.timeout_ms" aria-label="正常时间毫秒"></i-input-number>
                    </i-form-item>
                    <p class="g-form-note g-quality-traffic" role="status">{{ qualityTraffic }}</p>
                    <p v-if="editModalData.policy === 'quality'" class="g-form-note">连续失败 3 次且备用连续正常 2 次时切换；窗口满 20 次且备用不良至少少 3 次时择优，普通切换冷却 60 秒。所有线路共同失败不计入质量窗口。</p>
                    <p v-else class="g-form-note">连续失败 3 次时，按优先级切到连续正常 2 次的备用；高优先级连续正常 2 次且切换冷却满 60 秒后回切。慢请求不单独触发切换，故障转移可绕过冷却，共同失败无可靠备用时保持当前线路。</p>
                </template>
                <i-form-item label="启用">
                    <i-switch v-model="editModalEnabled"></i-switch>
                </i-form-item>
            </i-form>
            <div slot="footer">
                <i-button @click="editModal = false">取消</i-button
                ><i-button type="primary" :loading="saving" @click="invokeSave">保存配置</i-button>
            </div>
        </i-modal>

        <i-modal v-model="deleteModal" title="删除确认" class-name="g-dialog">
            <p>确认删除入口「{{ deleteModalData.name }}」？</p>
            <div slot="footer">
                <i-button @click="deleteModal = false">取消</i-button>
                <i-button type="error" @click="invokeConfirmDelete">删除</i-button>
            </div>
        </i-modal>

        <i-modal
            v-model="switchLogModal"
            :title="'切换记录 - ' + switchLogName"
            :width="640"
            footer-hide
            class-name="g-dialog"
        >
            <div :style="{ textAlign: 'right', marginBottom: '8px' }">
                <i-button size="small" @click="loadSwitchLog">刷新</i-button>
            </div>
            <div class="g-log-table">
                <i-table :columns="switch_log_cols" :data="switchLogData" size="small">
                    <template slot-scope="{ row }" slot="change_slot">
                        <span>{{ row.from || "无" }}</span>
                        <span class="g-form-note" :style="{ margin: '0 6px' }">→</span>
                        <span class="g-log-target">{{ row.to || "无" }}</span>
                    </template>
                </i-table>
            </div>
            <div
                v-if="switchLogData.length === 0"
                class="g-form-note"
                :style="{ textAlign: 'center', padding: '16px' }"
            >
                暂无切换记录
            </div>
            <div class="g-form-note" :style="{ marginTop: '8px' }">
                仅保留最近 20 次切换；「无」表示当时无可用 member。
            </div>
        </i-modal>
    </div>
</template>
<script type="text/javascript">
module.exports = {
    mixins: [window.GotunUI.list],
    data: function () {
        return {
            main_data: [],
            pageTotal: 0,
            pageSize: 0,
            tunnelOptions: [],
            editModal: false,
            editModalData: { uuid: "", name: "", listen: "", members: [], disabled: false, policy: "quality", quality: {} },
            editModalEnabled: true,
            deleteModal: false,
            deleteModalData: {},
            switchLogModal: false,
            switchLogName: "",
            switchLogData: [],
            switch_log_cols: [
                { title: "时间（北京时间）", key: "time", width: 170 },
                { title: "切换", slot: "change_slot" },
                { title: "原因", key: "reason", minWidth: 150 },
            ],
            routePage: this.page ? this.page : "",
            col_list: [
                { title: "名称", key: "name" },
                { title: "状态", key: "status" },
                { title: "监听", key: "listen" },
                { title: "member(优先级/健康)", slot: "members_slot" },
                { title: "操作", slot: "operate_slot", width: 280 },
            ],
        };
    },
    props: ["page"],
    computed: {
        qualityTraffic: function () {
            const q = this.editModalData.quality;
            const count = this.editModalData.members.length;
            const bytes = Number(q.download_bytes), interval = Number(q.interval_sec);
            if (!(bytes > 0 && interval > 0)) return "请填写有效的下载字节数和探测间隔。";
            const per = bytes * (30 * 86400 / interval) / 1e9;
            return "预计每月正文流量：每条 " + per.toFixed(2) + " GB，" + count + " 条共 " + (per * count).toFixed(2) + " GB（30 天；不含 TLS、协议及重传开销）。";
        },
    },
    methods: {
        defaultQuality: function (value) {
            return Object.assign({ download_url: "https://speed.cloudflare.com/__down?bytes=16384", connectivity_url: "https://www.gstatic.com/generate_204", download_status: 200, connectivity_status: 204, download_bytes: 16384, interval_sec: 30, timeout_ms: 5000, normal_ms: 2000 }, value || {});
        },
        policyLabel: function (row) {
            if (row.probe_mode === "legacy_frame") return "优先级故障转移（旧版单跳探测）";
            return row.policy === "quality" ? "完整链路质量选路" : "优先级故障转移（完整链路）";
        },
        memberStatus: function (row, name) {
            const q = (row.member_quality || {})[name];
            if (!q) return this.healthLabel((row.member_health || {})[name]);
            const labels = { normal: "正常", slow: "慢", failed: "失败", common_failure: "共同失败", evaluating: "评估中" };
            return labels[q.status] || "评估中";
        },
        qualityText: function (row, name) {
            const q = (row.member_quality || {})[name];
            if (!q) return "评估中";
            const labels = { normal: "正常", slow: "慢", failed: "失败", common_failure: "共同失败", evaluating: "评估中" };
            let text = labels[q.status] || "评估中";
            if (row.policy === "quality") {
                text += " · 不良 " + q.bad_samples + "/" + q.samples + "（窗口 20 次）";
                if (q.samples < 20) text += " · 评估中";
            }
            text += " · 连续失败 " + q.consecutive_failures + " · 连续正常 " + (q.consecutive_normal || 0);
            if (q.last_duration_ms > 0) text += " · " + q.last_duration_ms + " ms";
            if (q.connectivity) text += q.connectivity === "ok" ? " · 连通确认成功" : " · 连通确认失败";
            if (q.last_error) text += " · " + q.last_error;
            return text;
        },
        invokeRowAction: function (action, row) {
            if (action === "edit") this.invokeEdit(row);
            if (action === "delete") this.invokeDelete(row);
            if (action === "log") this.invokeSwitchLog(row);
        },
        moveMember: function (index, delta) {
            const members = this.editModalData.members;
            const target = index + delta;
            if (target < 0 || target >= members.length) return;
            const name = members.splice(index, 1)[0];
            members.splice(target, 0, name);
        },
        healthColor: function (h) {
            if (h === "up") return "green";
            if (h === "degraded") return "orange";
            if (h === "down") return "red";
            return "default";
        },
        tableData: function () {
            return this.loadList("/api/route_input/list", (row) =>
                Object.assign(row, { disabled: !!row.disabled, member_health: row.member_health || {} }),
            );
        },
        loadTunnels: function () {
            this.axios
                .post("/api/tunnel/list", {})
                .then((response) => {
                    if (response.data.code !== 200) {
                        return;
                    }
                    this.tunnelOptions = (response.data.data.list || []).map((t) => t.name);
                })
                .catch(this.showError);
        },
        invokeChangePage: function (page) {
            this.$router.push({ query: { page: page } });
        },
        invokeCreate: function () {
            this.editModalData = { uuid: "", name: "", listen: "", members: [], disabled: false, policy: "quality", quality: this.defaultQuality() };
            this.editModalEnabled = true;
            this.editModal = true;
        },
        invokeEdit: function (row) {
            this.editModalData = {
                uuid: row.uuid,
                name: row.name,
                listen: row.listen,
                members: (row.members || []).slice(),
                disabled: row.disabled,
                policy: row.policy || "priority",
                quality: this.defaultQuality(row.quality),
                probe_warnings: row.probe_warnings || [],
            };
            this.editModalEnabled = !row.disabled;
            this.editModal = true;
        },
        invokeSave: function () {
            var url = this.editModalData.uuid ? "/api/route_input/edit" : "/api/route_input/create";
            var payload = {
                uuid: this.editModalData.uuid,
                name: this.editModalData.name,
                listen: this.editModalData.listen,
                members: this.editModalData.members,
                disabled: !this.editModalEnabled,
                policy: this.editModalData.policy,
                quality: this.editModalData.quality,
            };
            return this.saveConfiguration(url, payload);
        },
        invokeSetDisabled: function (row, enabled) {
            return this.setDisabled(row, enabled, "/api/route_input/set_disabled", true);
        },
        invokeDelete: function (row) {
            this.deleteModalData = row;
            this.deleteModal = true;
        },
        invokeConfirmDelete: function () {
            this.axios
                .post("/api/route_input/delete", { uuid: this.deleteModalData.uuid })
                .then((response) => {
                    if (response.data.code !== 200) {
                        this.showError(response.data.msg);
                        return;
                    }
                    this.$Message.success("已删除");
                    this.deleteModal = false;
                    this.tableData();
                })
                .catch(this.showError);
        },
        invokeSwitchLog: function (row) {
            this.switchLogName = row.name;
            this.switchLogData = [];
            this.switchLogModal = true;
            this.loadSwitchLog();
        },
        loadSwitchLog: function () {
            this.axios
                .post("/api/route_input/switch_log?name=" + encodeURIComponent(this.switchLogName), {})
                .then((response) => {
                    if (response.data.code !== 200) {
                        this.showError(response.data.msg);
                        return;
                    }
                    this.switchLogData = response.data.data || [];
                })
                .catch(this.showError);
        },
    },
    created: function () {
        this.tableData();
        this.loadTunnels();
    },
};
</script>
