<template>
    <div>
        <g-page-heading
            title="智能路由 · 入口"
            subtitle="统一入口，透明转发到可用隧道。"
            eyebrow="SMART ROUTING / INPUT"
            unit="入口"
            @create="invokeCreate"
        ></g-page-heading>
        <g-summary :rows="main_data" unit="入口" :loading="listLoading" @refresh="tableData"></g-summary>
        <p class="g-route-hint">入口透明转发到成员的 input 监听地址；所有成员必须使用相同的 input 协议。</p>
        <section class="g-panel" aria-label="智能路由 · 入口列表">
            <g-list-toolbar v-model="searchText" :filter.sync="statusFilter" :counts="listCounts"
                ><button class="g-tools-button" @click="tableData">
                    <g-icon name="refresh"></g-icon>刷新
                </button></g-list-toolbar
            >
            <g-list-feedback
                :loading="listLoading && !main_data.length"
                :error="listError"
                :empty="!filteredRows.length"
                @retry="tableData"
            ></g-list-feedback>
            <template v-if="!listError && filteredRows.length">
                <table class="g-desktop-table">
                    <colgroup>
                        <col style="width: 23%" />
                        <col style="width: 12%" />
                        <col style="width: 21%" />
                        <col style="width: 28%" />
                        <col style="width: 16%" />
                    </colgroup>
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>运行状态</th>
                            <th>监听地址</th>
                            <th>成员 / 优先级</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="row in filteredRows" :key="row.name">
                            <td>
                                <div class="g-name-cell">
                                    <span class="g-record-icon"><g-icon name="input"></g-icon></span>
                                    <div class="g-name-stack">
                                        <button class="g-name" :title="row.name" @click="invokeEdit(row)">
                                            {{ row.name }}
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span
                                >
                            </td>
                            <td>
                                <span class="g-endpoint">{{ row.listen }}</span>
                            </td>
                            <td>
                                <div v-for="(name, index) in row.members" :key="name" class="g-member">
                                    <span class="g-priority">{{ index + 1 }}</span
                                    ><span class="g-member-name">{{ name }}</span
                                    ><span class="g-preferred" v-if="row.preferred_member === name">当前</span
                                    ><span :title="row.member_health[name]">{{
                                        healthLabel(row.member_health[name])
                                    }}</span
                                    ><span
                                        class="g-danger"
                                        v-if="(row.member_no_health || []).indexOf(name) >= 0"
                                        >无健康数据</span
                                    >
                                </div>
                            </td>
                            <td>
                                <div class="g-row-actions">
                                    <button
                                        class="g-switch"
                                        role="switch"
                                        :aria-checked="!row.disabled ? 'true' : 'false'"
                                        :aria-label="row.name + ' 启用状态'"
                                        :disabled="!!mutationPending[row.name]"
                                        @click="invokeSetDisabled(row, row.disabled)"
                                    ></button
                                    ><button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                    ><i-dropdown
                                        trigger="click"
                                        placement="bottom-end"
                                        transfer
                                        @on-click="invokeRowAction($event, row)"
                                        ><button
                                            class="g-more"
                                            :aria-label="row.name + ' 更多操作'"
                                            aria-haspopup="menu"
                                        >
                                            <g-icon name="more"></g-icon></button
                                        ><i-dropdown-menu slot="list"
                                            ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                            ><i-dropdown-item name="log">切换记录</i-dropdown-item
                                            ><i-dropdown-item name="delete" divided
                                                ><span class="g-danger">删除入口</span></i-dropdown-item
                                            ></i-dropdown-menu
                                        ></i-dropdown
                                    >
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="g-cards">
                    <article class="g-card" v-for="row in filteredRows" :key="row.name">
                        <div class="g-card-heading">
                            <span class="g-record-icon"><g-icon name="input"></g-icon></span>
                            <div class="g-name-stack">
                                <button class="g-name" @click="invokeEdit(row)">{{ row.name }}</button
                                ><span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span
                                >
                            </div>
                            <button
                                class="g-switch"
                                role="switch"
                                :aria-checked="!row.disabled ? 'true' : 'false'"
                                :aria-label="row.name + ' 启用状态'"
                                :disabled="!!mutationPending[row.name]"
                                @click="invokeSetDisabled(row, row.disabled)"
                            ></button>
                        </div>
                        <div class="g-card-listen">
                            <span>监听</span><span class="g-endpoint">{{ row.listen }}</span>
                        </div>
                        <div class="g-card-members">
                            <div v-for="(name, index) in row.members" :key="name" class="g-member">
                                <span class="g-priority">{{ index + 1 }}</span
                                ><span class="g-member-name">{{ name }}</span
                                ><span class="g-preferred" v-if="row.preferred_member === name">当前</span
                                ><span :title="row.member_health[name]">{{
                                    healthLabel(row.member_health[name])
                                }}</span
                                ><span class="g-danger" v-if="(row.member_no_health || []).indexOf(name) >= 0"
                                    >无健康数据</span
                                >
                            </div>
                        </div>
                        <div class="g-card-bottom">
                            <span class="g-subtext">按优先级自动切换</span>
                            <div class="g-card-buttons">
                                <button class="g-btn-link" @click="invokeSwitchLog(row)">记录</button
                                ><button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                ><i-dropdown
                                    trigger="click"
                                    placement="bottom-end"
                                    transfer
                                    @on-click="invokeRowAction($event, row)"
                                    ><button
                                        class="g-more"
                                        :aria-label="row.name + ' 更多操作'"
                                        aria-haspopup="menu"
                                    >
                                        <g-icon name="more"></g-icon></button
                                    ><i-dropdown-menu slot="list"
                                        ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                        ><i-dropdown-item name="log">切换记录</i-dropdown-item
                                        ><i-dropdown-item name="delete" divided
                                            ><span class="g-danger">删除入口</span></i-dropdown-item
                                        ></i-dropdown-menu
                                    ></i-dropdown
                                >
                            </div>
                        </div>
                    </article>
                </div></template
            ><g-list-footer
                :total="pageTotal"
                :size="pageSize"
                :page="$route.query.page"
                :visible="filteredRows.length"
                @change="invokeChangePage"
            ></g-list-footer>
        </section>
        <p class="g-page-note"><g-icon name="info"></g-icon>搜索与状态统计针对当前已加载列表。</p>
        <i-modal
            v-model="editModal"
            :title="editModalData.uuid ? '编辑入口' : '新建入口'"
            :width="560"
            class-name="g-dialog"
        >
            <i-form :label-width="110">
                <i-form-item label="名称">
                    <i-input v-model="editModalData.name" placeholder="如 socks-in"></i-input>
                </i-form-item>
                <i-form-item label="监听地址">
                    <i-input
                        v-model="editModalData.listen"
                        placeholder="host:port，如 0.0.0.0:1001"
                    ></i-input>
                    <div class="g-form-note">
                        入口模式监听裸 host:port，不带协议；透明转发到所选 member 的 input。
                    </div>
                </i-form-item>
                <i-form-item label="成员隧道（按优先级）">
                    <i-select
                        v-model="editModalData.members"
                        multiple
                        filterable
                        placeholder="选择 tunnel，顺序即优先级；input 协议需一致"
                    >
                        <i-option v-for="t in memberOptions" :value="t" :key="t">{{ t }}</i-option>
                    </i-select>
                    <ol class="g-member-order">
                        <li v-for="(name, index) in editModalData.members" :key="name">
                            <span>{{ index + 1 }}. {{ name }}</span
                            ><button
                                type="button"
                                :disabled="index === 0"
                                @click="moveMember(index, -1)"
                                :aria-label="name + ' 上移'"
                            >
                                ↑</button
                            ><button
                                type="button"
                                :disabled="index === editModalData.members.length - 1"
                                @click="moveMember(index, 1)"
                                :aria-label="name + ' 下移'"
                            >
                                ↓
                            </button>
                        </li>
                    </ol>
                    <div class="g-form-note g-danger">
                        所有 member 的 input 协议必须一致（如全为 socks5x）。
                    </div>
                </i-form-item>
                <i-form-item label="启用">
                    <i-switch v-model="editModalEnabled"></i-switch>
                </i-form-item>
            </i-form>
            <div slot="footer">
                <i-button @click="editModal = false">取消</i-button
                ><i-button type="primary" :loading="saving" @click="invokeSave">保存配置</i-button>
            </div>
        </i-modal>

        <i-modal v-model="deleteModal" title="删除确认" class-name="g-dialog">
            <p>确认删除入口「{{ deleteModalData.name }}」？</p>
            <div slot="footer">
                <i-button @click="deleteModal = false">取消</i-button>
                <i-button type="error" @click="invokeConfirmDelete">删除</i-button>
            </div>
        </i-modal>

        <i-modal
            v-model="switchLogModal"
            :title="'切换记录 - ' + switchLogName"
            :width="480"
            footer-hide
            class-name="g-dialog"
        >
            <div :style="{ textAlign: 'right', marginBottom: '8px' }">
                <i-button size="small" @click="loadSwitchLog">刷新</i-button>
            </div>
            <div class="g-log-table">
                <i-table :columns="switch_log_cols" :data="switchLogData" size="small">
                    <template slot-scope="{ row }" slot="change_slot">
                        <span>{{ row.from || "无" }}</span>
                        <span class="g-form-note" :style="{ margin: '0 6px' }">→</span>
                        <span class="g-log-target">{{ row.to || "无" }}</span>
                    </template>
                </i-table>
            </div>
            <div
                v-if="switchLogData.length === 0"
                class="g-form-note"
                :style="{ textAlign: 'center', padding: '16px' }"
            >
                暂无切换记录
            </div>
            <div class="g-form-note" :style="{ marginTop: '8px' }">
                仅保留最近 20 次切换；「无」表示当时无可用 member。
            </div>
        </i-modal>
    </div>
</template>
<script type="text/javascript">
module.exports = {
    mixins: [window.GotunUI.list],
    data: function () {
        return {
            main_data: [],
            pageTotal: 0,
            pageSize: 0,
            tunnelOptions: [],
            editModal: false,
            editModalData: { uuid: "", name: "", listen: "", members: [], disabled: false },
            editModalEnabled: true,
            deleteModal: false,
            deleteModalData: {},
            switchLogModal: false,
            switchLogName: "",
            switchLogData: [],
            switch_log_cols: [
                { title: "时间（北京时间）", key: "time", width: 170 },
                { title: "切换", slot: "change_slot" },
            ],
            routePage: this.page ? this.page : "",
            col_list: [
                { title: "名称", key: "name" },
                { title: "状态", key: "status" },
                { title: "监听", key: "listen" },
                { title: "member(优先级/健康)", slot: "members_slot" },
                { title: "操作", slot: "operate_slot", width: 280 },
            ],
        };
    },
    props: ["page"],
    methods: {
        invokeRowAction: function (action, row) {
            if (action === "edit") this.invokeEdit(row);
            if (action === "delete") this.invokeDelete(row);
            if (action === "log") this.invokeSwitchLog(row);
        },
        moveMember: function (index, delta) {
            const members = this.editModalData.members;
            const target = index + delta;
            if (target < 0 || target >= members.length) return;
            const name = members.splice(index, 1)[0];
            members.splice(target, 0, name);
        },
        healthColor: function (h) {
            if (h === "up") return "green";
            if (h === "degraded") return "orange";
            if (h === "down") return "red";
            return "default";
        },
        tableData: function () {
            return this.loadList("/api/route_input/list", (row) =>
                Object.assign(row, { disabled: !!row.disabled, member_health: row.member_health || {} }),
            );
        },
        loadTunnels: function () {
            this.axios
                .post("/api/tunnel/list", {})
                .then((response) => {
                    if (response.data.code !== 200) {
                        return;
                    }
                    this.tunnelOptions = (response.data.data.list || []).map((t) => t.name);
                })
                .catch(this.showError);
        },
        invokeChangePage: function (page) {
            this.$router.push({ query: { page: page } });
        },
        invokeCreate: function () {
            this.editModalData = { uuid: "", name: "", listen: "", members: [], disabled: false };
            this.editModalEnabled = true;
            this.editModal = true;
        },
        invokeEdit: function (row) {
            this.editModalData = {
                uuid: row.uuid,
                name: row.name,
                listen: row.listen,
                members: (row.members || []).slice(),
                disabled: row.disabled,
            };
            this.editModalEnabled = !row.disabled;
            this.editModal = true;
        },
        invokeSave: function () {
            var url = this.editModalData.uuid ? "/api/route_input/edit" : "/api/route_input/create";
            var payload = {
                uuid: this.editModalData.uuid,
                name: this.editModalData.name,
                listen: this.editModalData.listen,
                members: this.editModalData.members,
                disabled: !this.editModalEnabled,
            };
            return this.saveConfiguration(url, payload);
        },
        invokeSetDisabled: function (row, enabled) {
            return this.setDisabled(row, enabled, "/api/route_input/set_disabled", true);
        },
        invokeDelete: function (row) {
            this.deleteModalData = row;
            this.deleteModal = true;
        },
        invokeConfirmDelete: function () {
            this.axios
                .post("/api/route_input/delete", { uuid: this.deleteModalData.uuid })
                .then((response) => {
                    if (response.data.code !== 200) {
                        this.showError(response.data.msg);
                        return;
                    }
                    this.$Message.success("已删除");
                    this.deleteModal = false;
                    this.tableData();
                })
                .catch(this.showError);
        },
        invokeSwitchLog: function (row) {
            this.switchLogName = row.name;
            this.switchLogData = [];
            this.switchLogModal = true;
            this.loadSwitchLog();
        },
        loadSwitchLog: function () {
            this.axios
                .post("/api/route_input/switch_log?name=" + encodeURIComponent(this.switchLogName), {})
                .then((response) => {
                    if (response.data.code !== 200) {
                        this.showError(response.data.msg);
                        return;
                    }
                    this.switchLogData = response.data.data || [];
                })
                .catch(this.showError);
        },
    },
    created: function () {
        this.tableData();
        this.loadTunnels();
    },
};
</script>
