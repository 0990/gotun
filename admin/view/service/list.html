<template>
    <div>
        <g-page-heading
            title="内置服务"
            subtitle="管理本地监听，为连接提供基础服务。"
            eyebrow="BUILT-IN SERVICES"
            unit="服务"
            @create="invokeCreate"
        ></g-page-heading>
        <g-summary :rows="main_data" unit="服务" :loading="listLoading" @refresh="tableData"></g-summary>

        <section class="g-panel" aria-label="内置服务列表">
            <g-list-toolbar v-model="searchText" :filter.sync="statusFilter" :counts="listCounts"
                ><button class="g-tools-button" @click="tableData">
                    <g-icon name="refresh"></g-icon>刷新
                </button></g-list-toolbar
            >
            <g-list-feedback
                :loading="listLoading && !main_data.length"
                :error="listError"
                :empty="!filteredRows.length"
                @retry="tableData"
            ></g-list-feedback>
            <template v-if="!listError && filteredRows.length">
                <table class="g-desktop-table">
                    <colgroup>
                        <col style="width: 25%" />
                        <col style="width: 17%" />
                        <col style="width: 25%" />
                        <col style="width: 17%" />
                        <col style="width: 16%" />
                    </colgroup>
                    <thead>
                        <tr>
                            <th>服务名称</th>
                            <th>类型</th>
                            <th>监听地址</th>
                            <th>运行状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="row in filteredRows" :key="row.name">
                            <td>
                                <div class="g-name-cell">
                                    <span class="g-record-icon"><g-icon name="service"></g-icon></span>
                                    <div class="g-name-stack">
                                        <button class="g-name" :title="row.name" @click="invokeEdit(row)">
                                            {{ row.name }}
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="g-proto">{{ typeLabel(row.type) }}</span>
                            </td>
                            <td>
                                <span class="g-endpoint">{{ listenText(row) }}</span>
                            </td>
                            <td>
                                <span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span
                                >
                                <div v-if="!isRunning(row) && !row.disabled" class="g-subtext">
                                    {{ row.status }}
                                </div>
                            </td>
                            <td>
                                <div class="g-row-actions">
                                    <button
                                        class="g-switch"
                                        role="switch"
                                        :aria-checked="!row.disabled ? 'true' : 'false'"
                                        :aria-label="row.name + ' 启用状态'"
                                        :disabled="!!mutationPending[row.name]"
                                        @click="invokeSetDisabled(row, row.disabled)"
                                    ></button
                                    ><button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                    ><i-dropdown
                                        trigger="click"
                                        placement="bottom-end"
                                        transfer
                                        @on-click="invokeRowAction($event, row)"
                                        ><button
                                            class="g-more"
                                            :aria-label="row.name + ' 更多操作'"
                                            aria-haspopup="menu"
                                        >
                                            <g-icon name="more"></g-icon></button
                                        ><i-dropdown-menu slot="list"
                                            ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                            ><i-dropdown-item name="delete" divided
                                                ><span class="g-danger">删除服务</span></i-dropdown-item
                                            ></i-dropdown-menu
                                        ></i-dropdown
                                    >
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="g-cards">
                    <article class="g-card" v-for="row in filteredRows" :key="row.name">
                        <div class="g-card-heading">
                            <span class="g-record-icon"><g-icon name="service"></g-icon></span>
                            <div class="g-name-stack">
                                <button class="g-name" @click="invokeEdit(row)">{{ row.name }}</button
                                ><span class="g-state" :class="stateClass(row)"
                                    ><span class="g-dot"></span>{{ stateLabel(row) }}</span
                                >
                            </div>
                            <button
                                class="g-switch"
                                role="switch"
                                :aria-checked="!row.disabled ? 'true' : 'false'"
                                :aria-label="row.name + ' 启用状态'"
                                :disabled="!!mutationPending[row.name]"
                                @click="invokeSetDisabled(row, row.disabled)"
                            ></button>
                        </div>
                        <div class="g-card-listen">
                            <span class="g-proto">{{ typeLabel(row.type) }}</span
                            ><span class="g-endpoint">{{ listenText(row) }}</span>
                        </div>
                        <div class="g-card-bottom">
                            <span class="g-subtext">本地监听服务</span>
                            <div class="g-card-buttons">
                                <button class="g-btn-link" @click="invokeEdit(row)">编辑</button
                                ><i-dropdown
                                    trigger="click"
                                    placement="bottom-end"
                                    transfer
                                    @on-click="invokeRowAction($event, row)"
                                    ><button
                                        class="g-more"
                                        :aria-label="row.name + ' 更多操作'"
                                        aria-haspopup="menu"
                                    >
                                        <g-icon name="more"></g-icon></button
                                    ><i-dropdown-menu slot="list"
                                        ><i-dropdown-item name="edit">编辑配置</i-dropdown-item
                                        ><i-dropdown-item name="delete" divided
                                            ><span class="g-danger">删除服务</span></i-dropdown-item
                                        ></i-dropdown-menu
                                    ></i-dropdown
                                >
                            </div>
                        </div>
                    </article>
                </div></template
            ><g-list-footer
                :total="pageTotal"
                :size="pageSize"
                :page="$route.query.page"
                :visible="filteredRows.length"
                @change="invokeChangePage"
            ></g-list-footer>
        </section>
        <p class="g-page-note"><g-icon name="info"></g-icon>搜索与状态统计针对当前已加载列表。</p>
        <i-modal
            v-model="editModal"
            :title="editModalData.uuid ? '编辑服务' : '新建服务'"
            :width="560"
            class-name="g-dialog"
        >
            <i-form :label-width="110">
                <i-form-item label="名称">
                    <i-input v-model="editModalData.name" placeholder="如 my-echo"></i-input>
                </i-form-item>
                <i-form-item label="类型">
                    <i-select
                        v-model="editModalData.type"
                        @on-change="handleTypeChange"
                        :disabled="!!editModalData.uuid"
                    >
                        <i-option v-for="item in typeOptions" :key="item.value" :value="item.value">{{
                            item.label
                        }}</i-option>
                    </i-select>
                </i-form-item>

                <!-- echo / http_proxy 监听地址 -->
                <i-form-item v-if="isAddrType" label="监听地址">
                    <i-input v-model="editModalData.listen" placeholder="0.0.0.0:8081"></i-input>
                </i-form-item>

                <!-- socks5 / socks5x 监听端口与超时 -->
                <i-form-item v-if="isSocksType" label="监听端口">
                    <i-input-number
                        v-model="editModalData.listen_port"
                        :min="1"
                        :max="65535"
                        style="width: 100%"
                    ></i-input-number>
                </i-form-item>
                <i-form-item v-if="isSocksType" label="tcp超时(秒)">
                    <i-input-number
                        v-model="editModalData.tcp_timeout"
                        :min="0"
                        style="width: 100%"
                    ></i-input-number>
                </i-form-item>
                <i-form-item v-if="isSocksType" label="udp超时(秒)">
                    <i-input-number
                        v-model="editModalData.udp_timeout"
                        :min="0"
                        style="width: 100%"
                    ></i-input-number>
                </i-form-item>

                <!-- 仅 socks5 可选认证 -->
                <i-form-item v-if="editModalData.type === 'socks5_server'" label="用户名(可空)">
                    <i-input v-model="editModalData.username" placeholder="留空则不启用认证"></i-input>
                </i-form-item>
                <i-form-item v-if="editModalData.type === 'socks5_server'" label="密码(可空)">
                    <i-input
                        v-model="editModalData.password"
                        type="password"
                        placeholder="留空则不启用认证"
                    ></i-input>
                </i-form-item>

                <i-form-item label="启用">
                    <i-switch v-model="editModalEnabled"></i-switch>
                </i-form-item>
            </i-form>
            <div slot="footer">
                <i-button @click="editModal = false">取消</i-button
                ><i-button type="primary" :loading="saving" @click="invokeSave">保存配置</i-button>
            </div>
        </i-modal>

        <i-modal v-model="deleteModal" title="删除确认" class-name="g-dialog">
            <p>确认删除服务「{{ deleteModalData.name }}」？</p>
            <div slot="footer">
                <i-button @click="deleteModal = false">取消</i-button>
                <i-button type="error" @click="invokeConfirmDelete">删除</i-button>
            </div>
        </i-modal>
    </div>
</template>
<script type="text/javascript">
module.exports = {
    mixins: [window.GotunUI.list],
    data: function () {
        return {
            main_data: [],
            pageTotal: 0,
            pageSize: 0,
            editModal: false,
            editModalData: this.blankForm(),
            editModalEnabled: true,
            deleteModal: false,
            deleteModalData: {},
            typeOptions: [
                { value: "echo", label: "echo" },
                { value: "http_proxy", label: "http_proxy" },
                { value: "socks5_server", label: "socks5_server" },
                { value: "socks5x_server", label: "socks5x_server" },
            ],
            routePage: this.page ? this.page : "",
            col_list: [
                { title: "名称", key: "name" },
                { title: "类型", slot: "type_slot" },
                { title: "监听", slot: "listen_slot" },
                { title: "状态", key: "status" },
                { title: "操作", slot: "operate_slot", width: 220 },
            ],
        };
    },
    props: ["page"],
    computed: {
        isAddrType: function () {
            return this.editModalData.type === "echo" || this.editModalData.type === "http_proxy";
        },
        isSocksType: function () {
            return (
                this.editModalData.type === "socks5_server" || this.editModalData.type === "socks5x_server"
            );
        },
    },
    methods: {
        invokeRowAction: function (action, row) {
            if (action === "edit") this.invokeEdit(row);
            if (action === "delete") this.invokeDelete(row);
            if (action === "log") this.invokeSwitchLog(row);
        },
        moveMember: function (index, delta) {
            const members = this.editModalData.members;
            const target = index + delta;
            if (target < 0 || target >= members.length) return;
            const name = members.splice(index, 1)[0];
            members.splice(target, 0, name);
        },
        typeLabel: function (t) {
            var map = {
                echo: "echo",
                http_proxy: "http_proxy",
                socks5_server: "socks5",
                socks5x_server: "socks5x",
            };
            return map[t] || t;
        },
        listenText: function (row) {
            if (row.type === "echo" || row.type === "http_proxy") {
                return row.listen || "-";
            }
            return ":" + (row.listen_port || 0);
        },
        blankForm: function () {
            return {
                uuid: "",
                name: "",
                type: "echo",
                disabled: false,
                listen: "0.0.0.0:8081",
                listen_port: 1080,
                tcp_timeout: 300,
                udp_timeout: 120,
                username: "",
                password: "",
            };
        },
        handleTypeChange: function () {
            // 切换类型时给监听默认值
            if (this.editModalData.type === "echo") {
                this.editModalData.listen = "0.0.0.0:8081";
            } else if (this.editModalData.type === "http_proxy") {
                this.editModalData.listen = "0.0.0.0:3128";
            } else {
                this.editModalData.listen_port = 1080;
                if (!this.editModalData.tcp_timeout) this.editModalData.tcp_timeout = 300;
                if (!this.editModalData.udp_timeout) this.editModalData.udp_timeout = 120;
            }
        },
        tableData: function () {
            return this.loadList("/api/service/list", (row) =>
                Object.assign(row, { disabled: !!row.disabled, member_health: row.member_health || {} }),
            );
        },
        invokeChangePage: function (page) {
            this.$router.push({ query: { page: page } });
        },
        invokeCreate: function () {
            this.editModalData = this.blankForm();
            this.editModalEnabled = true;
            this.editModal = true;
        },
        invokeEdit: function (row) {
            this.editModalData = {
                uuid: row.uuid,
                name: row.name,
                type: row.type,
                disabled: row.disabled,
                listen: row.listen || "",
                listen_port: row.listen_port || 1080,
                tcp_timeout: row.tcp_timeout || 300,
                udp_timeout: row.udp_timeout || 120,
                username: row.username || "",
                password: row.password || "",
            };
            this.editModalEnabled = !row.disabled;
            this.editModal = true;
        },
        invokeSave: function () {
            var url = this.editModalData.uuid ? "/api/service/edit" : "/api/service/create";
            var payload = {
                uuid: this.editModalData.uuid,
                name: this.editModalData.name,
                type: this.editModalData.type,
                disabled: !this.editModalEnabled,
                listen: this.editModalData.listen,
                listen_port: this.editModalData.listen_port,
                tcp_timeout: this.editModalData.tcp_timeout,
                udp_timeout: this.editModalData.udp_timeout,
                username: this.editModalData.username,
                password: this.editModalData.password,
            };
            return this.saveConfiguration(url, payload);
        },
        invokeSetDisabled: function (row, enabled) {
            return this.setDisabled(row, enabled, "/api/service/set_disabled", false);
        },
        invokeDelete: function (row) {
            this.deleteModalData = row;
            this.deleteModal = true;
        },
        invokeConfirmDelete: function () {
            this.axios
                .post("/api/service/delete", { name: this.deleteModalData.name })
                .then((response) => {
                    if (response.data.code !== 200) {
                        this.showError(response.data.msg);
                        return;
                    }
                    this.$Message.success("已删除");
                    this.deleteModal = false;
                    this.tableData();
                })
                .catch(this.showError);
        },
    },
    mounted: function () {
        this.tableData();
    },
};
</script>
