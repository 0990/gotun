<body><header><div><h1>gotun / 更清晰的文字层级</h1><p>方案 02 · 白底 / 深色文字 / 绿色点缀 · 仅效果图，待确认</p></div><nav aria-label="预览模式"><button data-tone="original" onclick="tone('original')">原版文字</button><button class="active" data-tone="contrast" onclick="tone('contrast')">新版文字</button><button class="active" data-mode="both" onclick="mode('both')">双端对照</button><button data-mode="desktop" onclick="mode('desktop')">桌面端</button><button data-mode="mobile" onclick="mode('mobile')">手机端</button><a href="app.html" target="_blank" rel="noopener">打开完整原型 ↗</a></nav></header><main class="board" id="board"><section class="desktop-preview"><div class="label">DESKTOP<span>1440 px · 表格视图</span></div><div class="desktop-frame"><div class="browser-top"><i></i><i></i><i></i><span class="address">gotun / 控制台</span></div><div class="desktop-stage"><iframe id="desktop" src="app.html" title="桌面端交互原型"></iframe></div></div><p class="note"><strong>优先保证看得清。</strong><br>名称与地址使用深灰色，表头加粗。正文 14–15px，辅助文字也保持清晰可读。</p></section><section class="mobile-preview"><div class="label">MOBILE<span>390 px · 卡片视图</span></div><div class="phone"><div class="phone-status"><span>9:41</span><div class="island"></div><span class="status-icons">▮▮▮ ◉ <i class="battery"></i></span></div><iframe id="mobile" src="app.html" title="手机端交互原型"></iframe><div class="phone-home"></div></div><p class="note"><strong>手机端同步加深文字。</strong><br>名称 15px，地址 13px，状态 12px。<br>可体验搜索、筛选、编辑和新建。</p></section></main><footer>纯本地预览 · 示例数据 · 未接入真实服务 · 请确认文字与配色后再应用到正式界面</footer><script>function scale(){let stage=document.querySelector('.desktop-stage');if(!stage.clientWidth)return;let s=stage.clientWidth/1440;document.querySelector('#desktop').style.transform=`scale(${s})`;stage.style.height=1000*s+'px'}function mode(m){document.querySelector('#board').className='board '+(m==='both'?'':m);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));requestAnimationFrame(scale)}new ResizeObserver(scale).observe(document.querySelector('.desktop-frame'));window.addEventListener('resize',scale);scale();</script><script>let reviewTone="contrast";function tone(value){reviewTone=value;document.querySelectorAll("[data-tone]").forEach(b=>b.classList.toggle("active",b.dataset.tone===value));document.querySelectorAll("iframe").forEach(f=>f.src="app.html?tone="+value);document.querySelector("nav a").href="app.html?tone="+value;}</script></body></html>
