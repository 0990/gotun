function endpointHtml(addr,proto){return `<span class="proto">${esc(proto.toUpperCase())}</span><span class="endpoint">${esc(addr)}</span>`}
function members(t){return (t.members||[]).map((m,i)=>`<div class="member"><span class="priority">${i+1}</span><span>${esc(m)}</span>${i===0&&t.enabled?'<span class="preferred">当前</span>':''}</div>`).join('')}
function render(){renderNav();let all=data(),running=all.filter(t=>t.enabled).length;$('#total-count').textContent=all.length;$('#running-count').textContent=running;$('#off-count').textContent=all.length-running;$('#all-filter').textContent=all.length;$('#running-filter').textContent=running;$('#off-filter').textContent=all.length-running;$$('.filter').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))});let q=$('#search').value.toLowerCase().trim();let visible=all.filter(t=>(filter==='all'||(filter==='running'?t.enabled:!t.enabled))&&[t.name,t.input,t.output,t.ip,t.op,t.type,...(t.members||[])].filter(Boolean).join(' ').toLowerCase().includes(q));$('#result-count').textContent=`${visible.length===all.length?'共':'筛选结果：'} ${visible.length} 条${page().unit}`;if(!visible.length){$('#list').innerHTML='<div class="empty">没有匹配的结果，试试其他关键词或状态。</div>';return}let table,card;
if(current==='tunnel'){
table=`<table class="data-table"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:12%"><col style="width:20%"><col style="width:23%"><col style="width:9%"></colgroup><thead><tr><th>隧道名称</th><th>运行状态</th><th>延迟 / 丢包</th><th>监听入口</th><th>转发出口</th><th>启用</th></tr></thead><tbody>${visible.map(t=>`<tr><td>${tableName(t)}</td><td>${status(t)}<div class="secondary-metric">${!t.enabled?'未探测':t.health==='up'?'连接正常':'健康未探测'}</div></td><td>${quality(t)}<div class="secondary-metric">${t.enabled&&t.rtt!==null?'0% 丢包':'未探测'}</div></td><td>${endpointHtml(t.input,t.ip)}</td><td>${endpointHtml(t.output,t.op)}</td><td><div class="row-actions">${switchHtml(t)}${moreHtml(t)}</div></td></tr>`).join('')}</tbody></table>`;
card=visible.map(t=>`<article class="tunnel-card ${!t.enabled?'off-card':''}"><div class="card-heading"><span class="tunnel-icon">${icon('tunnel')}</span><div class="name-stack"><button class="name-text" onclick="openDetail(${t.id})">${esc(t.name)}</button>${status(t)}</div>${switchHtml(t)}</div><div class="card-endpoints"><div class="card-endpoint"><span class="endpoint-dot"></span><span class="endpoint-label">入口</span><span class="proto">${t.ip.toUpperCase()}</span><span class="endpoint">${esc(t.input)}</span></div><div class="card-endpoint"><span class="endpoint-dot"></span><span class="endpoint-label">出口</span><span class="proto">${t.op.toUpperCase()}</span><span class="endpoint">${esc(t.output)}</span></div></div><div class="card-bottom"><div class="card-metrics">${quality(t)}<span class="metric-line"></span><span class="secondary-metric">${t.enabled&&t.rtt!==null?'0% 丢包':'未探测'}</span></div><div class="card-buttons"><button class="edit" onclick="openForm(${t.id})">编辑</button>${moreHtml(t)}</div></div></article>`).join('');
}else if(current==='input'||current==='output'){
table=`<table class="data-table route-table"><colgroup><col style="width:24%"><col style="width:12%"><col style="width:22%"><col style="width:28%"><col style="width:14%"></colgroup><thead><tr><th>${page().unit}名称</th><th>运行状态</th><th>监听地址</th><th>成员 / 优先级</th><th>操作</th></tr></thead><tbody>${visible.map(t=>`<tr><td>${tableName(t)}</td><td>${status(t)}</td><td>${endpointHtml(t.input,t.ip)}</td><td>${members(t)}</td><td><div class="route-actions">${switchHtml(t)}<button class="link" onclick="openForm(${t.id})">编辑</button>${moreHtml(t)}</div></td></tr>`).join('')}</tbody></table>`;
card=visible.map(t=>`<article class="tunnel-card"><div class="card-heading"><span class="tunnel-icon">${icon(page().icon)}</span><div class="name-stack"><button class="name-text" onclick="openDetail(${t.id})">${esc(t.name)}</button>${status(t)}</div>${switchHtml(t)}</div><div class="route-card-listen"><span>监听</span><span class="endpoint">${t.ip}@${esc(t.input)}</span></div><div class="card-members">${members(t)}</div><div class="card-bottom"><span class="secondary-metric">按优先级自动切换</span><div class="card-buttons"><button class="edit" onclick="openLog(${t.id})">切换记录</button><button class="edit" onclick="openForm(${t.id})">编辑</button>${moreHtml(t)}</div></div></article>`).join('');
}else{
table=`<table class="data-table"><colgroup><col style="width:28%"><col style="width:20%"><col style="width:23%"><col style="width:15%"><col style="width:14%"></colgroup><thead><tr><th>服务名称</th><th>服务类型</th><th>监听地址</th><th>状态</th><th>操作</th></tr></thead><tbody>${visible.map(t=>`<tr><td>${tableName(t)}</td><td><span class="service-type">${t.type}</span></td><td>${endpointHtml(t.input,t.ip)}</td><td>${status(t)}</td><td><div class="route-actions">${switchHtml(t)}<button class="link" onclick="openForm(${t.id})">编辑</button>${moreHtml(t)}</div></td></tr>`).join('')}</tbody></table>`;
card=visible.map(t=>`<article class="tunnel-card service-card"><div class="card-heading"><span class="tunnel-icon">${icon('service')}</span><div class="name-stack"><button class="name-text" onclick="openDetail(${t.id})">${esc(t.name)}</button>${status(t)}</div>${switchHtml(t)}</div><div class="route-card-listen"><span class="service-type">${t.type}</span><span class="endpoint">${esc(t.input)}</span></div><div class="card-bottom"><span class="secondary-metric">${t.ip.toUpperCase()} 监听</span><div class="card-buttons"><button class="edit" onclick="openForm(${t.id})">编辑</button>${moreHtml(t)}</div></div></article>`).join('');
}
$('#list').innerHTML=table+`<div class="mobile-cards">${card}</div>`;
}
$('#search').addEventListener('input',render);$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
function refresh(){$('#update-text').textContent='刚刚更新';toast('示例列表已刷新')}
function toggleProbe(){probe=!probe;$('#probe-btn').setAttribute('aria-pressed',probe);$('#probe-label').textContent=probe?'探测已开启':'开启探测';toast(`演示：已${probe?'开启':'关闭'}健康探测，未发起真实请求`)}
function selectImport(){ $('#import-file').click() }$('#import-file').onchange=e=>{let fs=[...e.target.files];if(fs.length)toast(`已选择 ${fs.length} 个文件；原型仅演示选取流程`);e.target.value=''};
function showDialog(title,subtitle,body,foot){closeMenu();lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-subtitle').textContent=subtitle;$('#dialog-body').innerHTML=body;$('#dialog-foot').innerHTML=foot||'<button class="btn" onclick="closeDialog()">关闭</button>';$('#overlay').classList.add('open');document.body.style.overflow='hidden';$('.dialog').focus()}
function closeDialog(){ $('#overlay').classList.remove('open');document.body.style.overflow='';lastFocus?.isConnected&&lastFocus.focus() }
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if($('#overlay').classList.contains('open'))closeDialog()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Tab'&&$('#overlay').classList.contains('open')){let els=[...$('.dialog').querySelectorAll('button,input,select,textarea,summary,[tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.disabled);let first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.dialog'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
const field=(label,html,hint='')=>`<label class="field">${label}${html}${hint?`<small>${hint}</small>`:''}</label>`;
const input=(name,value='',placeholder='',required=false)=>`<input name="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?'required':''}>`;
const select=(name,options,value)=>`<select name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
function openForm(id){editing=id??null;const t=data().find(t=>t.id===id)||{};let body=`<form id="edit-form" onsubmit="saveForm(event)">${field('名称',input('name',t.name,'例如 sg_tcpmux',true))}`;
if(current==='tunnel')body+=`<div class="form-grid">${field('运行模式',select('mode',['default','frpc','frps'],t.mode||'default'))}${field('初始状态',select('enabled',['启用','停用'],t.enabled===false?'停用':'启用'))}</div><div class="form-section">${icon('input')}监听入口</div><div class="form-grid">${field('协议',select('ip',['socks5x','tcp','tcp_mux','udp','quic','kcp','kcp_mux','kcpx','kcpx_mux'],t.ip||'socks5x'))}${field('监听地址',input('input',t.input||'0.0.0.0:1080','host:port',true))}</div><div class="form-section">${icon('output')}转发出口</div><div class="form-grid">${field('协议',select('op',['tcp_mux','tcp','udp','quic','kcp','kcp_mux','kcpx','kcpx_mux'],t.op||'tcp_mux'))}${field('目标地址',input('output',t.output||'','host:port',true))}</div><details class="advanced"><summary>高级设置 · 协议参数与加密</summary>${field('入口协议配置','<textarea name="in_proto_cfg" rows="3" placeholder="JSON 配置"></textarea>')}${field('出口协议配置','<textarea name="out_proto_cfg" rows="3" placeholder="JSON 配置"></textarea>')}<div class="form-grid">${field('入口解密模式',select('in_decrypt_mode',['none','gcm'],'none'))}${field('入口解密密钥','<input name="in_decrypt_key" type="password" autocomplete="off">')}${field('出口加密模式',select('out_crypt_mode',['none','gcm'],'none'))}${field('出口加密密钥','<input name="out_crypt_key" type="password" autocomplete="off">')}</div>${field('入口扩展配置','<textarea name="in_extend" rows="2" placeholder="JSON 配置"></textarea>')}${field('出口扩展配置','<textarea name="out_extend" rows="2" placeholder="JSON 配置"></textarea>')}</details>`;
else if(current==='service')body+=`<div class="form-grid">${field('服务类型',select('type',['Echo','SOCKS5','HTTP Proxy'],t.type||'Echo'))}${field('状态',select('enabled',['启用','停用'],t.enabled===false?'停用':'启用'))}</div>${field('监听地址',input('input',t.input||'0.0.0.0:4003','host:port',true))}`;
else body+=`<div class="hint">${current==='input'?'入口透明转发到成员的 input 地址，请保持所有成员的 input 协议一致。':'按成员顺序选择出口，优先使用第一条健康线路。'}</div><div class="form-grid">${current==='output'?field('监听协议',select('ip',['socks5x','tcp','udp'],t.ip||'socks5x')):field('转发模式',select('ip',['tcp'],'tcp'))}${field('状态',select('enabled',['启用','停用'],t.enabled===false?'停用':'启用'))}</div>${field('监听地址',input('input',t.input||'0.0.0.0:1088','host:port',true))}${field('成员隧道（按优先级排序）',`<textarea name="members" rows="3" required placeholder="每行一个隧道名称">${esc((t.members||['sg_tcpmux_transfer_pw','goai_tcpmux_pw']).join('\n'))}</textarea>`,'第一行为最高优先级；原型暂以文本展示成员排序。')}`;
body+='</form>';showDialog((id?'编辑':'新建')+page().unit,'配置清晰分组，高级参数按需展开。',body,'<button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" type="submit" form="edit-form">保存'+(id?'修改':'配置')+'</button>')}
function saveForm(event){event.preventDefault();const obj=Object.fromEntries(new FormData($('#edit-form')));obj.name=obj.name.trim();if(!obj.name){toast('请填写名称');return}if(data().some(t=>t.name===obj.name&&t.id!==editing)){toast('名称已存在，请使用其他名称');return}obj.enabled=obj.enabled==='启用';let original=data().find(t=>t.id===editing);if(obj.members)obj.members=obj.members.split('\n').map(x=>x.trim()).filter(Boolean);if(current==='tunnel'){obj.health='unknown';obj.rtt=null}if(current==='service')obj.ip={Echo:'tcp',SOCKS5:'socks5','HTTP Proxy':'http'}[obj.type];if(original)Object.assign(original,obj);else data().unshift({...obj,id:Date.now()});closeDialog();render();toast('已保存到预览，未修改真实配置')}
function openDetail(id){let t=data().find(t=>t.id===id);let rows=[['监听入口',`${t.ip}@${t.input}`]];if(t.output)rows.push(['转发出口',`${t.op}@${t.output}`]);if(current==='tunnel')rows.push(['延迟',t.enabled&&t.rtt!==null?`${t.rtt} ms`:'未探测'],['丢包率',t.enabled&&t.rtt!==null?'0%':'未探测'],['带宽','未测速']);if(t.members)rows.push(['优先成员',t.members.join(' → ')]);if(t.type)rows.push(['服务类型',t.type]);showDialog(page().unit+'详情','示例配置 / 只读预览',`<div class="detail-title">${esc(t.name)}</div>${status(t)}<div class="detail-rows">${rows.map(([k,v])=>`<div><span>${k}</span><code>${esc(v)}</code></div>`).join('')}</div>`,`<button class="btn" onclick="closeDialog()">关闭</button><button class="btn primary" onclick="openForm(${id})">${icon('edit')}编辑配置</button>`)}
function closeMenu(){$('#menu').hidden=true}
function showMenu(event,id){event.stopPropagation();const b=event.currentTarget.getBoundingClientRect();const m=$('#menu');let items=[['eye','查看详情',`openDetail(${id})`],['edit','编辑配置',`openForm(${id})`]];if(current==='tunnel')items.push(['activity','带宽测速',`openDiagnostic(${id},'带宽测速')`],['terminal','MTR 诊断',`openDiagnostic(${id},'MTR 诊断')`],['import','导出配置',`exportItem(${id})`],['copy','克隆隧道',`cloneItem(${id})`]);if(current==='output'||current==='input')items.push(['activity','切换记录',`openLog(${id})`]);items.push(['trash','删除'+page().unit,`deleteItem(${id})`]);m.innerHTML=items.map(([i,t,fn])=>`<button role="menuitem" class="${i==='trash'?'danger':''}" onclick="closeMenu();${fn}">${icon(i)}${t}</button>`).join('');m.setAttribute('role','menu');m.hidden=false;let h=m.getBoundingClientRect().height;m.style.left=Math.max(8,Math.min(window.innerWidth-180,b.right-172))+'px';m.style.top=Math.max(8,Math.min(b.bottom+5,window.innerHeight-h-78))+'px';m.querySelector('button').focus()}
document.addEventListener('click',e=>{if(!$('#menu').contains(e.target))closeMenu()});window.addEventListener('resize',closeMenu);window.addEventListener('scroll',closeMenu);
function deleteItem(id){let t=data().find(t=>t.id===id);showDialog('删除'+page().unit,'请确认要从本次预览中移除的配置。',`<div class="hint">确认删除 <strong>${esc(t.name)}</strong>？此操作仅影响本次原型预览。</div>`,`<button class="btn" onclick="closeDialog()">取消</button><button class="btn danger" onclick="confirmDelete(${id})">确认删除</button>`)}
function confirmDelete(id){data().splice(data().findIndex(t=>t.id===id),1);closeDialog();render();toast('已从本次预览中删除')}
function cloneItem(id){const t=data().find(t=>t.id===id);let name=t.name+'_copy',i=2;while(data().some(x=>x.name===name))name=t.name+'_copy'+i++;data().unshift({...t,name,id:Date.now(),enabled:false,rtt:null});render();toast('已创建停用的示例副本')}
function exportItem(id){let t=data().find(t=>t.id===id);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({preview_only:true,...t},null,2)],{type:'application/json'}));a.download=t.name+'.preview.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出预览数据，不可作为正式隧道配置导入')}
function openTools(){showDialog('检测工具','快速检查连接，集中查看诊断结果。',`<div class="hint">原型使用模拟结果，不会访问本地端口或远程服务器。</div><div class="radio-options"><label><input type="radio" name="check" value="Echo" checked>Echo 检测</label><label><input type="radio" name="check" value="SOCKS5">SOCKS5 检测</label><label><input type="radio" name="check" value="HTTP Proxy">HTTP 检测</label></div><label class="field">检测地址<input id="diagnostic-address" class="diagnostic-address" value="127.0.0.1:1080" placeholder="host:port"></label><div id="diagnostic-result"></div><div class="mobile-only"><button class="btn ghost" onclick="toggleProbe()">${icon('activity')} ${probe?'关闭':'开启'}健康探测</button><button class="btn ghost" onclick="selectImport()">${icon('import')}导入配置</button><button class="btn ghost" onclick="refresh()">${icon('refresh')}刷新</button><button class="btn ghost" onclick="toast('设计预览：退出操作未连接真实会话')">${icon('logout')}退出</button></div>`,'<button class="btn" onclick="closeDialog()">关闭</button><button class="btn primary" onclick="runDiagnostic()">'+icon('activity')+'运行演示</button>')}
function runDiagnostic(){const addr=$('#diagnostic-address').value.trim();if(!addr){toast('请填写检测地址');return}$('#diagnostic-result').innerHTML=`<div class="demo-result"><strong>模拟检测完成</strong><br>检测类型：${esc($('input[name=check]:checked').value)}<br>目标地址：${esc(addr)}<br>结果区域将在正式版本中展示真实返回信息。</div>`}
function openDiagnostic(id,title){const t=data().find(t=>t.id===id);showDialog(title,t.name,`<div class="hint">示例诊断面板。正式版本接入现有 ${title==='MTR 诊断'?'MTR 流式终端':'带宽测速'}功能。</div><div class="demo-result"><span>目标</span><br><code>${esc(t.output)}</code><br><br>${title==='MTR 诊断'?'MTR 实时输出将展示在此区域，窄屏支持终端内部滚动。':'测速结果将展示带宽、耗时和执行状态。'}</div>`,'<button class="btn" onclick="closeDialog()">关闭</button><button class="btn primary" onclick="toast(\'仅演示操作，未发起网络检测\')">运行演示</button>')}
function openLog(id){const t=data().find(t=>t.id===id);showDialog('切换记录',t.name,`<div class="hint">以下为演示记录，时间按北京时间展示。</div><div class="detail-rows"><div><span>2026-10-17 18:12:36</span><code>优先成员恢复 → 切回主线路</code></div><div><span>2026-10-17 18:10:02</span><code>主线路不可用 → 切换备用线路</code></div></div>`)}
const initial=new URLSearchParams(location.search).get('page');navigate(navs.some(n=>n.id===initial)?initial:'tunnel');
</script>
</body>
</html>
